<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penyuluh Agama Islam AI</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d5c4a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --teal: #0d5c4a;
            --teal-mid: #1a7a62;
            --teal-light: #2eaa8a;
            --teal-glow: rgba(13,92,74,0.15);
            --gold: #b8862a;
            --gold-light: #d4a844;
            --cream: #f8f4ec;
            --cream-dark: #ddd0b8;
            --ink: #1a1812;
            --ink-muted: #9a8f80;
            --panel: #ffffff;
            --sidebar-w: 280px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: var(--cream); color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; }
        body { display: flex; flex-direction: column; height: 100dvh; }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--teal) 0%, #072e24 100%);
            padding: 0 20px;
            height: 58px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 20px rgba(0,0,0,0.25);
            z-index: 50;
            color: white;
        }
        .header-logo { width: 38px; height: 38px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 2px 10px rgba(184,134,42,0.4); }
        .header-title { font-family: 'Lora', serif; font-size: 17px; font-weight: 600; }
        .header-sub { color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 300; }
        .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .menu-btn { width: 34px; height: 34px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* APP LAYOUT */
        .app-body { flex: 1; display: flex; overflow: hidden; position: relative; }
        .overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 30; opacity: 0; transition: opacity 0.3s; }
        .overlay.active { display: block; opacity: 1; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--panel);
            border-right: 1px solid var(--cream-dark);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 40;
        }
        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }

        .sidebar-tabs { display: flex; border-bottom: 1px solid var(--cream-dark); }
        .s-tab { flex: 1; padding: 12px 4px; font-size: 10px; font-weight: 700; color: var(--ink-muted); border: none; background: none; cursor: pointer; text-transform: uppercase; border-bottom: 2px solid transparent; }
        .s-tab.active { color: var(--teal); border-bottom-color: var(--teal); background: var(--teal-glow); }
        .sidebar-panel { display: none; flex: 1; overflow-y: auto; padding: 15px; }
        .sidebar-panel.active { display: block; }

        /* CHAT AREA */
        .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--cream); }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        /* MSG BUBBLES */
        .msg-row { display: flex; gap: 10px; max-width: 85%; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.ai { align-self: flex-start; }

        .msg-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
        .msg-av.ai { background: var(--teal); color: white; }
        .msg-av.user { background: var(--gold); color: white; }

        .msg-bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg-row.user .msg-bubble { background: var(--teal); color: white; border-bottom-right-radius: 2px; }
        .msg-row.ai .msg-bubble { background: white; color: var(--ink); border-bottom-left-radius: 2px; border: 1px solid var(--cream-dark); }

        /* INPUT AREA */
        .input-area { background: white; padding: 15px; border-top: 1px solid var(--cream-dark); display: flex; gap: 10px; align-items: flex-end; }
        .input-box { flex: 1; background: var(--cream); border: 1.5px solid var(--cream-dark); border-radius: 25px; padding: 8px 15px; display: flex; align-items: center; }
        .input-box textarea { flex: 1; border: none; background: transparent; outline: none; resize: none; max-height: 100px; font-family: inherit; font-size: 14px; padding: 5px 0; }
        .btn-send { width: 45px; height: 45px; background: var(--teal); color: white; border: none; border-radius: 50%; cursor: pointer; font-size: 18px; transition: 0.2s; flex-shrink: 0; }
        .btn-send:hover { background: var(--teal-mid); transform: scale(1.05); }

        /* WELCOME */
        .welcome-screen { text-align: center; margin: auto; max-width: 400px; }
        .welcome-emblem { font-size: 50px; margin-bottom: 10px; }
        .welcome-bismillah { font-family: 'Amiri', serif; font-size: 24px; color: var(--teal); margin-bottom: 10px; }
        
        /* TYPING INDICATOR */
        .typing { display: flex; gap: 4px; padding: 10px; }
        .typing span { width: 6px; height: 6px; background: var(--teal-light); border-radius: 50%; animation: blink 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-logo">🕌</div>
        <div>
            <div class="header-title">Penyuluh AI</div>
            <div class="header-sub">Asisten Digital Keislaman</div>
        </div>
        <div class="header-right">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        </div>
    </header>

    <main class="app-body">
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-tabs">
                <button class="s-tab active" onclick="switchTab('sholat')">Sholat</button>
                <button class="s-tab" onclick="switchTab('quran')">Al-Quran</button>
            </div>
            <div class="sidebar-panel active" id="sholat">
                <p style="font-size: 13px; color: var(--ink-muted);">Jadwal Sholat (Contoh Jakarta):</p>
                <ul style="list-style: none; margin-top: 10px; font-weight: 600;">
                    <li style="padding: 8px 0; border-bottom: 1px solid var(--cream-dark);">Subuh: 04:35</li>
                    <li style="padding: 8px 0; border-bottom: 1px solid var(--cream-dark);">Dzuhur: 11:52</li>
                    <li style="padding: 8px 0; border-bottom: 1px solid var(--cream-dark);">Ashar: 15:13</li>
                    <li style="padding: 8px 0; border-bottom: 1px solid var(--cream-dark);">Maghrib: 17:48</li>
                    <li style="padding: 8px 0; border-bottom: 1px solid var(--cream-dark);">Isya: 18:59</li>
                </ul>
            </div>
            <div class="sidebar-panel" id="quran">
                <p style="font-size: 13px;">Fitur Al-Quran sedang dalam pengembangan.</p>
            </div>
        </aside>

        <section class="chat-area">
            <div class="messages" id="chat-messages">
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-emblem">🕌</div>
                    <div class="welcome-bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
                    <p class="header-sub" style="color: var(--ink);">Tanyakan hal seputar Fiqih, Doa, atau Tafsir.</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-box">
                    <textarea id="user-input" rows="1" placeholder="Ketik pesan..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                </div>
                <button class="btn-send" onclick="handleSend()">➤</button>
            </div>
        </section>
    </main>

    <script>
        const API_KEY = "AIzaSyCQlWB7g22i-rcDPLC3alvN3zeEmcXvYUM";

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            // Remove welcome
            const welcome = document.getElementById('welcome-screen');
            if (welcome) welcome.remove();

            appendMessage('user', message);
            input.value = '';
            input.style.height = 'auto';

            const typingId = appendTyping();
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Anda adalah pakar agama Islam yang bijak. Jawablah pertanyaan ini dengan singkat, padat, dan berikan dalil jika ada: ${message}` }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(typingId).remove();
                
                const aiText = data.candidates[0].content.parts[0].text;
                appendMessage('ai', aiText);
            } catch (error) {
                document.getElementById(typingId).remove();
                appendMessage('ai', "Maaf, server sedang sibuk. Mohon coba lagi nanti.");
            }
        }

        function appendMessage(sender, text) {
            const container = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            row.innerHTML = `
                <div class="msg-av ${sender}">${sender === 'ai' ? '🕌' : '👤'}</div>
                <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
            `;
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function appendTyping() {
            const id = 'typing-' + Date.now();
            const container = document.getElementById('chat-messages');
            const row = document.createElement('div');
            row.className = 'msg-row ai';
            row.id = id;
            row.innerHTML = `
                <div class="msg-av ai">🕌</div>
                <div class="typing"><span></span><span></span><span></span></div>
            `;
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
